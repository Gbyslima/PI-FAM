<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha</title>
    <link rel="stylesheet" href="css/redefinir.css">
    <link rel="stylesheet" href="css/respansivo.css">
</head>
<body>
    <div class="login-container">
        <div class="left-panel">
            <div class="left-panel">
                <img src="imagens/clinica.png" alt="Ilustração de estética" class="login-image"/>
        
            </div>
        </div>
        <div class="right-panel">
            <h1>Redefinir Senha</h1>
            <p>Informe seus dados abaixo</p>
            <form id="resetPasswordForm" action="banco/redefinir.php" method="POST">
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" name="cpf" placeholder="Digite seu CPF" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Digite seu Email" required>

                <button type="submit">Enviar</button>
            </form>
            <button class="back-button" onclick="window.history.back()">Voltar</button>
        </div>
    </div>
</body>
</html>
