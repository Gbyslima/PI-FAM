<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Clínica de Estética</title>
  <link rel="stylesheet" href="css/login.css" />

</head>
<body>
  <div class="login-container">
    <div class="left-panel">
        <img src="imagens/clinica.png" alt="Ilustração de estética" class="login-image"/>

    </div>
    
    <div class="right-panel">
      <h1>Bem-vindo(a)</h1>
      <p class="subtitle">Inscreva-se</p>
      
      <div id="loginForm" class="csschapeu">

        <label for="name">Nome</label>
        <input type="name" id="nome" name="nome" placeholder="Digite seu Nome" required />

        <label for="senha">CPF</label>
        <input type="text" id="cpf" name="cpf" placeholder="Digite sua CPF" required />

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Digite seu email" required />
        
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required />

        <button id="btncadastrar" onclick="cadastro()" >Cadastrar-se</button>
      </div>
    </div>
  </div>
  <script>
    async function cadastro() {
        const name = document.getElementById('nome').value;
        const email = document.getElementById('email').value;
        const cpf = document.getElementById('cpf').value;
        const senha = document.getElementById('senha').value;

        const data = {
            name: nome,
            email: email,
            password: senha,
            cpf: cpf

        };

        try {
            var botao = document.getElementById('btncadastrar');
            botao.class = 'loader';
            await fetch('https://modulum-api.azurewebsites.net/user/cadastro-externo', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data),
            }).then(response => {
              if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
              }
              return response.json();
            }).then(jsonData => {
              if(jsonData.succeeded){
                window.location.href = "login.html";
              }
              else
              {
                alert(jsonData.messages[0]);
                botao.class = '';
              }
            })            
        } catch (error) {
          alert(error.Error);
        }
        
    }
</script>
</body>
</html>
