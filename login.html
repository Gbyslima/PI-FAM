<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Clínica de Estética</title>
  <link rel="stylesheet" href="css/login.css" />

</head>
<body>
  <div class="login-container">
    <div class="left-panel">
        <img src="imagens/clinica.png" alt="Ilustração de estética" class="login-image"/>

    </div>
    
    <div class="right-panel">
      <h1>Bem-vindo(a)</h1>
      <p class="subtitle">Insera suas credenciais</p>
      
      <div id="loginForm" class="csschapeu">

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Digite seu email" required />
        
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required />
        
        <a class="link-forgot" href="redefinir.html">Esqueceu sua senha?</a>
        
        <button id="btnEntrar" onclick="entrar()" >Entrar</button>

        <button type="submit" onclick="redirect()" >Cadastrar-se</button>

      </div>
    </div>
  </div>
  <script>
    function redirect() {
      window.location.href = "cadastrar.html";
    }

    async function entrar() {
        const email = document.getElementById('email').value;
        const senha = document.getElementById('senha').value;

        const data = {
            email: email,
            password: senha
        };

        try {
            var botao = document.getElementById('btnEntrar');
            botao.class = 'loader';
            await fetch('https://modulum-api.azurewebsites.net/token/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data),
            }).then(response => {
              if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
              }
              return response.json();
            }).then(jsonData => {
              if(jsonData.succeeded){
                window.location.href = "dashboard.html";
              }
              else
              {
                alert(jsonData.messages[0]);
                botao.class = '';
              }
            })            
        } catch (error) {
          alert(error.Error);
        }
        
    }
</script>
</body>
</html>
